# CLIProxyAPI config template (nixpkgs/home-manager/ai/gateway.nix). Activation
# writes it to /opt/homebrew/etc/cliproxyapi.conf when that file is missing,
# filling @HOME@, @API_KEY@ and @MANAGEMENT_SECRET@ from pass.
config-version: 8
routing:
    strategy: "weighted-round-robin"
    session-affinity: true
    session-affinity-ttl: "1h"
    session-affinity-subagents: true
    force-model-prefix: false
    cooldown:
        disable-cooling: true
        save-cooldown-status: true
        transient-error-cooldown-seconds: 0
    retry:
        request-retry: 3
        max-retry-credentials: 0
        max-retry-interval: 30
plugins:
    enabled: true
    dir: "@HOME@/.cli-proxy-api/plugins"
    configs:
        headroom:
            enabled: true
            endpoint: http://127.0.0.1:8787/v1/compress
            compress_user_messages: false
            stats_path: @HOME@/.cli-proxy-api/plugins/data/headroom/stats.json
            timeout_ms: 10000
            min_chars: 512
            target_ratio: 0.5
requests:
    proxy-url: ""
    passthrough-headers: false
    nonstream-keepalive-interval: 0
multimedia:
    disable-image-generation: false
    video-result-auth-cache-ttl: "3h"
observability:
    logs:
        request-log: false
        debug: false
        logging-to-file: false
        logs-max-total-size-mb: 0
        error-logs-max-files: 10
    pprof:
        enable: false
        addr: "127.0.0.1:8316"
    usage:
        usage-statistics-enabled: true
        redis-usage-queue-retention-seconds: 60
oauth:
    providers:
        claude:
            claude-code:
                disable-cloaking-model-list: false
            model-level-cooling: false
            disable-claude-cloak-mode: false
        antigravity:
            antigravity-credits: true
        aistudio:
            ws-auth: true
        xai:
            inject-x-search: false
        codex:
            disable-codex-cloaking: false
            stream-bootstrap-buffering: false
            stream-bootstrap-timeout: "0"
            optimize-multi-agent-v2: false
            orphan-delegation-compatibility: false
            model-level-cooling: false
            live-media-relay:
                enabled: false
                max-sessions: 32
                disable-private-remote-ips: false
                public-ip: ""
                udp-port-min: 0
                udp-port-max: 0
            response-steering: false
    auth-dir: "@HOME@/.cli-proxy-api"
access:
    api-keys:
        - "@API_KEY@"
server:
    host: ""
    port: 8317
    trusted-proxies: []
    tls:
        enable: false
        cert: ""
        key: ""
    discovery:
        enabled: false
        service-type: _ai-gateway._tcp
        subtypes:
            - _chat-completions
            - _responses
            - _messages
            - _generate-content
            - _interactions
    commercial-mode: false
credentials:
    concurrency:
        cpa-heartbeat-timeout: 3s
        cpa-cancel-bound: 5s
        reclaim-grace: 5s
        cleanup-interval: 5s
        release-flush-interval: 250ms
        release-max-backoff: 2s
        busy-retry-min: 250ms
        busy-retry-max: 1s
        max-limit: 1000000
    in-flight:
        snapshot-interval: 2s
        stale-after: 10s
        max-part-bytes: 262144
        max-part-count: 64
        max-revision-bytes: 16777216
        max-aggregate-groups: 100000
        max-details: 10000
        max-string-bytes: 256
        staging-retention: 1m
management:
    allow-remote: false
    secret-key: "@MANAGEMENT_SECRET@"
    disable-control-panel: false
    panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"
